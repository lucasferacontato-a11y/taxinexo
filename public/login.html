<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TAXINEXO - Terminal de Autenticação</title>
  
  <!-- PWA & Apple Web App Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#05070A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  
  <!-- Estilos & Tipografias -->
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      background-color: #030508;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Fundo com Brilhos Cyberpunk */
    body::before {
      content: '';
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.12) 0%, rgba(0, 102, 255, 0.05) 50%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .auth-wrapper {
      width: 100%;
      max-width: 440px;
      padding: 24px 20px;
      position: relative;
      z-index: 1;
    }

    /* Brand Header */
    .auth-hero {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-logo-badge {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      transform: rotate(45deg);
      background: var(--primary-gradient);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .auth-logo-badge i {
      transform: rotate(-45deg);
      font-size: 22px;
      color: #000;
    }

    .auth-brand-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      margin-bottom: 4px;
    }

    .auth-brand-title span {
      color: var(--primary);
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
    }

    .auth-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    /* Glassmorphism Auth Card */
    .auth-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-glow);
      position: relative;
      overflow: hidden;
    }

    .auth-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.4), transparent);
    }

    /* Switcher Tabs */
    .auth-tabs-nav {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 22px;
      gap: 4px;
    }

    .auth-nav-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 13px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s ease;
      font-family: 'Space Grotesk', sans-serif;
    }

    .auth-nav-btn.active {
      background: var(--primary-gradient);
      color: #000;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
      font-weight: 800;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .field-input-box {
      position: relative;
    }

    .field-input-box i.input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--primary);
      font-size: 14px;
      opacity: 0.8;
    }

    .field-input-box input {
      width: 100%;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border-color);
      padding: 13px 42px 13px 40px;
      border-radius: var(--radius-md);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      transition: all 0.2s ease;
    }

    .field-input-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.2);
    }

    .btn-pwd-eye {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 15px;
      padding: 4px;
    }

    .btn-pwd-eye:hover {
      color: var(--primary);
    }

    /* Alert Feedback */
    .auth-alert-toast {
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
      animation: fadeIn 0.25s ease;
    }

    .auth-alert-toast.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
      display: flex;
    }

    .auth-alert-toast.success {
      background: rgba(0, 255, 136, 0.15);
      border: 1px solid rgba(0, 255, 136, 0.4);
      color: var(--accent-green);
      display: flex;
    }

    .form-panel {
      display: none;
    }

    .form-panel.active {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    .invite-badge-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--accent-gold);
      background: rgba(250, 219, 95, 0.12);
      border: 1px solid rgba(250, 219, 95, 0.25);
      padding: 3px 10px;
      border-radius: 12px;
      margin-top: 6px;
      font-weight: 600;
    }

    /* Trust Badges Footer */
    .trust-footer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: 24px;
      color: var(--text-muted);
      font-size: 11px;
    }

    .trust-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .trust-item i {
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">

    <!-- Header & Logo Cyberpunk -->
    <div class="auth-hero">
      <div class="auth-logo-badge">
        <i class="fa-solid fa-satellite-dish"></i>
      </div>
      <h1 class="auth-brand-title">TAXI<span>NEXO</span></h1>
      <p class="auth-subtitle">Terminal de Gestão de Frotas Autônomas</p>
    </div>

    <!-- Card de Autenticação -->
    <div class="auth-card">

      <!-- Navegação de Abas -->
      <div class="auth-tabs-nav" role="tablist">
        <button class="auth-nav-btn active" id="btn-tab-login" onclick="switchFormTab('login')">
          <i class="fa-solid fa-right-to-bracket"></i> Entrar
        </button>
        <button class="auth-nav-btn" id="btn-tab-register" onclick="switchFormTab('register')">
          <i class="fa-solid fa-user-plus"></i> Criar Conta
        </button>
      </div>

      <!-- Alerta de Feedback -->
      <div class="auth-alert-toast" id="auth-alert" role="alert"></div>

      <!-- Formulário 1: Login -->
      <form id="form-login" class="form-panel active" onsubmit="executeLogin(event)">
        
        <div class="form-group">
          <label class="form-label" for="login-phone">Telefone do Operador (WhatsApp):</label>
          <div class="field-input-box">
            <i class="fa-solid fa-mobile-screen input-icon"></i>
            <input type="tel" id="login-phone" placeholder="(11) 98765-4321" required autofocus autocomplete="tel">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Senha de Segurança:</label>
          <div class="field-input-box">
            <i class="fa-solid fa-shield-halved input-icon"></i>
            <input type="password" id="login-password" placeholder="Digite sua senha" required autocomplete="current-password">
            <button type="button" class="btn-pwd-eye" onclick="togglePasswordVisibility('login-password', this)">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-login-action" class="btn btn-primary btn-block" style="margin-top: 20px;">
          <span>Acessar Painel</span> <i class="fa-solid fa-arrow-right"></i>
        </button>

      </form>

      <!-- Formulário 2: Cadastro -->
      <form id="form-register" class="form-panel" onsubmit="executeRegister(event)">
        
        <div class="form-group">
          <label class="form-label" for="reg-phone">Seu WhatsApp de Acesso:</label>
          <div class="field-input-box">
            <i class="fa-solid fa-mobile-screen input-icon"></i>
            <input type="tel" id="reg-phone" placeholder="(11) 98765-4321" required autocomplete="tel">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Criar Senha (Mínimo 6 dígitos):</label>
          <div class="field-input-box">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" minlength="6" required autocomplete="new-password">
            <button type="button" class="btn-pwd-eye" onclick="togglePasswordVisibility('reg-password', this)">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-invite">Código de Convite (Opcional):</label>
          <div class="field-input-box">
            <i class="fa-solid fa-ticket input-icon"></i>
            <input type="text" id="reg-invite" placeholder="Ex: NEXO8843">
          </div>
          <div class="invite-badge-tag" id="invite-tag" style="display: none;">
            <i class="fa-solid fa-circle-check"></i> Código de indicação aplicado!
          </div>
        </div>

        <button type="submit" id="btn-register-action" class="btn btn-primary btn-block" style="margin-top: 20px;">
          <span>Criar Conta e Começar</span> <i class="fa-solid fa-bolt"></i>
        </button>

      </form>

    </div>

    <!-- Rodapé & Selos de Segurança -->
    <div class="trust-footer">
      <div class="trust-item"><i class="fa-solid fa-shield-check"></i> SSL 256-Bit</div>
      <div class="trust-item"><i class="fa-solid fa-bolt"></i> Pix Instantâneo</div>
      <div class="trust-item"><i class="fa-solid fa-lock"></i> Dados Criptografados</div>
    </div>

    <div class="app-version" style="margin-top: 18px; text-align: center;">
      <span style="font-size: 10px; color: var(--text-muted); font-family: monospace; opacity: 0.6;">TAXINEXO Quantum Core v1.0.5</span>
    </div>

  </div>

  <script>
    const API_BASE = (window.location.hostname === 'localhost' && window.location.port === '8080')
      ? 'http://localhost:3000/api' 
      : '/api';

    document.addEventListener('DOMContentLoaded', () => {
      // Captura código de convite da URL (ex: login.html?ref=NEXO8843)
      const urlParams = new URLSearchParams(window.location.search);
      const ref = urlParams.get('ref') || urlParams.get('invite') || urlParams.get('i');
      if (ref) {
        switchFormTab('register');
        const inviteInput = document.getElementById('reg-invite');
        if (inviteInput) {
          inviteInput.value = ref.toUpperCase();
          document.getElementById('invite-tag').style.display = 'inline-flex';
        }
      }

      // Máscara inteligente para telefones brasileiros
      ['login-phone', 'reg-phone'].forEach(id => {
        const input = document.getElementById(id);
        input?.addEventListener('input', (e) => {
          let v = e.target.value.replace(/\D/g, '');
          if (v.length > 11) v = v.substring(0, 11);
          if (v.length > 6) {
            e.target.value = `(${v.substring(0,2)}) ${v.substring(2,7)}-${v.substring(7)}`;
          } else if (v.length > 2) {
            e.target.value = `(${v.substring(0,2)}) ${v.substring(2)}`;
          } else if (v.length > 0) {
            e.target.value = `(${v}`;
          }
        });
      });
    });

    function switchFormTab(tab) {
      document.querySelectorAll('.auth-nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.form-panel').forEach(f => f.classList.remove('active'));
      hideAlert();

      if (tab === 'login') {
        document.getElementById('btn-tab-login').classList.add('active');
        document.getElementById('form-login').classList.add('active');
      } else {
        document.getElementById('btn-tab-register').classList.add('active');
        document.getElementById('form-register').classList.add('active');
      }
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    }

    function showAlert(msg, type = 'error') {
      const box = document.getElementById('auth-alert');
      box.textContent = msg;
      box.className = `auth-alert-toast ${type}`;
    }

    function hideAlert() {
      const box = document.getElementById('auth-alert');
      box.style.display = 'none';
      box.className = 'auth-alert-toast';
    }

    async function executeLogin(e) {
      e.preventDefault();
      hideAlert();

      const phone = document.getElementById('login-phone').value;
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login-action');

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Autenticando...';

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });

        const data = await res.json();

        if (res.ok && data.token) {
          showAlert('✅ Autenticado com sucesso! Entrando no painel...', 'success');
          localStorage.setItem('taxinexo_token', data.token);
          setTimeout(() => {
            window.location.href = './';
          }, 800);
        } else {
          showAlert(data.error || 'Credenciais inválidas.');
          btn.disabled = false;
          btn.innerHTML = '<span>Acessar Painel</span> <i class="fa-solid fa-arrow-right"></i>';
        }
      } catch (err) {
        showAlert('Falha na comunicação com o servidor.');
        btn.disabled = false;
        btn.innerHTML = '<span>Acessar Painel</span> <i class="fa-solid fa-arrow-right"></i>';
      }
    }

    async function executeRegister(e) {
      e.preventDefault();
      hideAlert();

      const phone = document.getElementById('reg-phone').value;
      const password = document.getElementById('reg-password').value;
      const inviteCode = document.getElementById('reg-invite').value.trim();
      const btn = document.getElementById('btn-register-action');

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Criando Conta...';

      try {
        const res = await fetch(`${API_BASE}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password, inviteCode })
        });

        const data = await res.json();

        if (res.ok && data.token) {
          showAlert('🎉 Conta criada com sucesso! Acessando painel...', 'success');
          localStorage.setItem('taxinexo_token', data.token);
          setTimeout(() => {
            window.location.href = './';
          }, 1000);
        } else {
          showAlert(data.error || 'Erro ao registrar conta.');
          btn.disabled = false;
          btn.innerHTML = '<span>Criar Conta e Começar</span> <i class="fa-solid fa-bolt"></i>';
        }
      } catch (err) {
        showAlert('Falha na comunicação com o servidor.');
        btn.disabled = false;
        btn.innerHTML = '<span>Criar Conta e Começar</span> <i class="fa-solid fa-bolt"></i>';
      }
    }
  </script>
</body>
</html>
